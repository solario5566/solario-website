<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Solario | Ontario's Trusted Solar Installer - Toronto &amp; GTA</title>
    <meta
      name="description"
      content="Solario installs premium solar systems, EV chargers, battery storage, and heat pumps for Ontario homes and businesses."
    />

    <!-- Favicons / App Icons -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b1220" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CWNZEVSGQH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-CWNZEVSGQH');
    </script>
  </head>

  <body>
    <!-- Netlify Forms detector (required for SPA builds) -->
    <form
      name="quote"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="quote" />
      <input name="bot-field" />

      <input name="firstName" />
      <input name="lastName" />
      <input name="email" />
      <input name="phone" />
      <input name="address" />
      <select name="service">
        <option value="solar">Residential Solar</option>
        <option value="repair">Solar Repair / Panel Upgrade</option>
        <option value="ev">EV Charging Station</option>
        <option value="battery">Battery Storage</option>
        <option value="heatpump">Heat Pump</option>
        <option value="multiple">Multiple Services</option>
      </select>
      <select name="roofType">
        <option value="shingle">Asphalt Shingle</option>
        <option value="metal">Metal</option>
        <option value="tile">Tile</option>
        <option value="flat">Flat Roof</option>
        <option value="other">Other</option>
      </select>
      <textarea name="details"></textarea>

      <input type="hidden" name="first_utm_source" />
      <input type="hidden" name="first_utm_medium" />
      <input type="hidden" name="first_utm_campaign" />
      <input type="hidden" name="first_utm_term" />
      <input type="hidden" name="first_utm_content" />
      <input type="hidden" name="first_gclid" />
      <input type="hidden" name="first_gbraid" />
      <input type="hidden" name="first_wbraid" />
      <input type="hidden" name="first_landing_page" />
      <input type="hidden" name="first_landing_url" />
      <input type="hidden" name="latest_utm_source" />
      <input type="hidden" name="latest_utm_medium" />
      <input type="hidden" name="latest_utm_campaign" />
      <input type="hidden" name="latest_utm_term" />
      <input type="hidden" name="latest_utm_content" />
      <input type="hidden" name="latest_gclid" />
      <input type="hidden" name="latest_gbraid" />
      <input type="hidden" name="latest_wbraid" />
      <input type="hidden" name="latest_landing_page" />
      <input type="hidden" name="latest_landing_url" />
      <input type="hidden" name="page_path_at_submit" />
      <input type="hidden" name="referrer" />
      <input type="hidden" name="submission_timestamp" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
